<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webb fractal — interactive</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0a0e1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: #b9b09b;
  }
  #scene { width: 100vw; height: 100vh; cursor: grab; }
  #scene:active { cursor: grabbing; }
  .caption {
    position: absolute; bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(218, 160, 85, 0.7);
    pointer-events: none;
    user-select: none;
  }
  .hint {
    position: absolute; top: 14px; right: 14px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(185, 176, 155, 0.45);
    pointer-events: none;
  }
  /* Depth toggle */
  .depth-toggle {
    position: absolute;
    bottom: 44px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 0;
    user-select: none;
  }
  .depth-toggle .label {
    font-size: 10px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: rgba(185, 176, 155, 0.55);
    align-self: center;
    margin-right: 14px;
  }
  .depth-toggle button {
    background: transparent;
    border: 1px solid rgba(218, 160, 85, 0.4);
    color: rgba(218, 160, 85, 0.85);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    padding: 6px 14px;
    margin: 0 -1px 0 0;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .depth-toggle button:first-of-type { border-radius: 2px 0 0 2px; }
  .depth-toggle button:last-of-type  { border-radius: 0 2px 2px 0; }
  .depth-toggle button:hover {
    color: #e8e0ce;
    border-color: rgba(218, 160, 85, 0.7);
  }
  .depth-toggle button.active {
    background: rgba(218, 160, 85, 0.18);
    color: #e8e0ce;
    border-color: #daa055;
  }
</style>
</head>
<body>
<div id="scene"></div>
<div class="hint">drag · scroll</div>

<div class="depth-toggle">
  <span class="label">Recursion</span>
  <button data-depth="1">Depth 1</button>
  <button data-depth="2" class="active">Depth 2</button>
  <button data-depth="3">Depth 3</button>
</div>

<div class="caption">The Webb fractal &nbsp;·&nbsp; 34.38° &nbsp;·&nbsp; 55.62° &nbsp;·&nbsp; 90.00°</div>

<!-- Three.js loader: try the local vendor copy first (works offline, can't be
     blocked by ad-block / privacy extensions / corporate networks), then fall
     back to the cdnjs CDN, then to unpkg. Whichever succeeds first calls
     initWebbFractal(); if all three fail we surface a visible error in the
     caption rather than leaving the canvas inscrutably empty. -->
<!-- Wire button visual state immediately so they respond even if WebGL / the
     init function fails. The init function re-wires them with the real
     buildFractal callback. -->
<script>
(function wireButtonsVisually() {
  document.querySelectorAll('.depth-toggle button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.depth-toggle button').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
    });
  });
})();
</script>
<script>
(function loadThree() {
  var urls = [
    'js/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  function tryNext(i) {
    if (i >= urls.length) {
      var c = document.querySelector('.caption');
      if (c) { c.style.color = '#e88'; c.textContent = 'Three.js failed to load from local file and CDNs — fractal cannot render. Check console / network.'; }
      return;
    }
    var s = document.createElement('script');
    s.src = urls[i];
    s.onload = function () {
      if (typeof THREE !== 'undefined' && typeof initWebbFractal === 'function') initWebbFractal();
      else tryNext(i + 1);
    };
    s.onerror = function () { tryNext(i + 1); };
    document.head.appendChild(s);
  }
  tryNext(0);
})();
</script>
<script>
function initWebbFractal() {
  if (typeof THREE === 'undefined') return;
  // ---------- Three.js scene setup ----------
  const container = document.getElementById('scene');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e1a);

  const FOV = 45;
  const camera = new THREE.PerspectiveCamera(
    FOV, window.innerWidth / window.innerHeight, 0.1, 1000
  );

  // The seed tetrahedron's bounding sphere has radius ≈ 1.16; we want the
  // sphere to fill the iframe with a small margin in WHICHEVER direction is
  // smaller (so the structure stays maximally large regardless of aspect).
  const BOUNDING_R = 1.16;
  const MARGIN = 1.05;  // 5 % margin from the closest edge

  function fitDistance() {
    const aspect = window.innerWidth / window.innerHeight;
    const tanV = Math.tan((FOV * Math.PI) / 360);  // half vFOV
    const tanH = tanV * aspect;
    const tan = Math.min(tanV, tanH);  // limiting axis
    return (BOUNDING_R * MARGIN) / tan;
  }

  let BASE_Z = fitDistance();
  camera.position.set(0, 0, BASE_Z);

  // WebGL context creation can fail when the browser has hit its per-process
  // context limit (too many other 3D tabs/extensions open), when hardware
  // acceleration is disabled, or when the GPU driver is in a bad state.
  // Surface a clear message instead of silently leaving an empty canvas.
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  } catch (err) {
    console.error('WebGL renderer creation failed:', err);
    var cap = document.querySelector('.caption');
    if (cap) {
      cap.style.color = '#e88';
      cap.style.fontSize = '12px';
      cap.style.lineHeight = '1.6';
      cap.style.padding = '0 20px';
      cap.innerHTML =
        'WebGL context unavailable — the fractal cannot render in this browser session.<br>' +
        'Common causes: too many other 3D tabs / extensions open, or hardware acceleration disabled.<br>' +
        'Try: close some tabs and reload &nbsp;·&nbsp; or visit <code>chrome://gpu</code> to check WebGL status.';
    }
    return;
  }
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // Detect mid-flight context loss (driver reset, GPU process crash, tab
  // backgrounding past the limit). Without this the canvas freezes silently.
  renderer.domElement.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    console.warn('WebGL context lost');
    var cap2 = document.querySelector('.caption');
    if (cap2) {
      cap2.style.color = '#e88';
      cap2.textContent = 'WebGL context lost — reload the page to recover.';
    }
  }, false);

  // ---------- The Webb fractal geometry ----------
  // Seed: right triangle with angles 34.38° · 55.62° · 90°. The legs satisfy
  // the golden ratio (φ = 1.618...). We lift this triangle into 3D by adding
  // an apex above its centroid, forming a tetrahedron — and then apply
  // Sierpinski-style recursive subdivision: each tetrahedron is replaced
  // by four corner tetrahedra at half scale, leaving an octahedral void.
  const PHI = (1 + Math.sqrt(5)) / 2;

  const A = new THREE.Vector3( PHI, 0, 0 );
  const B = new THREE.Vector3( 0,   1, 0 );
  const C = new THREE.Vector3( 0,   0, 0 );

  const centroidXY = new THREE.Vector3()
    .add(A).add(B).add(C).multiplyScalar(1/3);
  const apex = centroidXY.clone().add(new THREE.Vector3(0, 0, 1.05));

  // Center the seed tetrahedron on its own centroid
  const seedVerts = [A.clone(), B.clone(), C.clone(), apex.clone()];
  const seedCentroid = seedVerts
    .reduce((acc, v) => acc.add(v), new THREE.Vector3())
    .multiplyScalar(1 / 4);
  seedVerts.forEach(v => v.sub(seedCentroid));

  // ---------- Color palettes ----------
  const lineColors = [
    { color: 0xc48c42, opacity: 0.85 },  // depth 0 — outer gold
    { color: 0xe8e0ce, opacity: 0.55 },  // depth 1 — cream
    { color: 0xb9b09b, opacity: 0.35 },  // depth 2 — dim cream
    { color: 0x78c8b4, opacity: 0.40 },  // depth 3 — teal accent
  ];
  const sphereColors = [
    0xe8e0ce, 0xdaa055, 0x78c8b4, 0xb4a0e6
  ];
  const sphereRadii = [0.075, 0.050, 0.035, 0.022];

  // ---------- Group + (re)builder ----------
  const group = new THREE.Group();
  scene.add(group);

  function mid(p, q) {
    return new THREE.Vector3().add(p).add(q).multiplyScalar(0.5);
  }

  function clearGroup() {
    while (group.children.length) {
      const child = group.children.pop();
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    }
  }

  function buildFractal(DEPTH) {
    clearGroup();

    const levels = Array.from({ length: DEPTH + 1 }, () => ({
      edges: [], nodes: [],
    }));

    function sierpinski(verts, depth, levelIdx) {
      const t = verts;
      const tetraEdges = [
        [t[0], t[1]], [t[1], t[2]], [t[2], t[0]],
        [t[0], t[3]], [t[1], t[3]], [t[2], t[3]],
      ];
      tetraEdges.forEach(e => levels[levelIdx].edges.push(e));
      t.forEach(v => levels[levelIdx].nodes.push(v.clone()));
      if (depth === 0) return;
      const m01 = mid(t[0], t[1]);
      const m02 = mid(t[0], t[2]);
      const m03 = mid(t[0], t[3]);
      const m12 = mid(t[1], t[2]);
      const m13 = mid(t[1], t[3]);
      const m23 = mid(t[2], t[3]);
      sierpinski([t[0], m01, m02, m03], depth - 1, levelIdx + 1);
      sierpinski([t[1], m01, m12, m13], depth - 1, levelIdx + 1);
      sierpinski([t[2], m02, m12, m23], depth - 1, levelIdx + 1);
      sierpinski([t[3], m03, m13, m23], depth - 1, levelIdx + 1);
    }

    sierpinski(seedVerts, DEPTH, 0);

    // Wireframes by level
    levels.forEach((level, i) => {
      if (i >= lineColors.length || level.edges.length === 0) return;
      const geom = new THREE.BufferGeometry();
      const positions = [];
      level.edges.forEach(([p, q]) => {
        positions.push(p.x, p.y, p.z, q.x, q.y, q.z);
      });
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const mat = new THREE.LineBasicMaterial({
        color: lineColors[i].color,
        transparent: true,
        opacity: lineColors[i].opacity,
      });
      group.add(new THREE.LineSegments(geom, mat));
    });

    // Spheres at all unique node positions (deduplicated)
    const seen = new Set();
    const uniqueNodes = [];
    const SNAP = 1e4;
    levels.forEach((level, depth) => {
      level.nodes.forEach(v => {
        const key = [
          Math.round(v.x * SNAP),
          Math.round(v.y * SNAP),
          Math.round(v.z * SNAP),
        ].join('|');
        if (!seen.has(key)) {
          seen.add(key);
          uniqueNodes.push({ pos: v, depth });
        }
      });
    });
    const sphereGeoms = sphereRadii.map(r => new THREE.SphereGeometry(r, 18, 12));
    uniqueNodes.forEach(({ pos, depth }) => {
      const d = Math.min(depth, sphereColors.length - 1);
      const mat = new THREE.MeshBasicMaterial({ color: sphereColors[d] });
      const s = new THREE.Mesh(sphereGeoms[d], mat);
      s.position.copy(pos);
      group.add(s);
    });
  }

  // Build at default depth
  let currentDepth = 2;
  buildFractal(currentDepth);

  // ---------- Depth toggle wiring ----------
  document.querySelectorAll('.depth-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = parseInt(btn.dataset.depth, 10);
      if (d === currentDepth) return;
      currentDepth = d;
      document.querySelectorAll('.depth-toggle button')
        .forEach(b => b.classList.toggle('active', b === btn));
      buildFractal(d);
    });
  });

  // ---------- Interaction ----------
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let velX = 0.0018, velY = 0.0005;
  let zoom = 1;
  const minZoom = 0.5, maxZoom = 2.5;

  container.addEventListener('mousedown', e => {
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
    velX = 0; velY = 0;
  });
  window.addEventListener('mouseup',   () => { isDragging = false; });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = (e.clientX - lastX) * 0.005;
    const dy = (e.clientY - lastY) * 0.005;
    group.rotation.y += dx;
    group.rotation.x += dy;
    lastX = e.clientX; lastY = e.clientY;
  });
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.05 : 0.95;
    zoom = Math.max(minZoom, Math.min(maxZoom, zoom * factor));
    camera.position.z = BASE_Z / zoom;
  }, { passive: false });

  // Touch
  let touchX = 0, touchY = 0;
  container.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      velX = 0; velY = 0;
    }
  });
  container.addEventListener('touchmove', e => {
    if (e.touches.length === 1) {
      const dx = (e.touches[0].clientX - touchX) * 0.005;
      const dy = (e.touches[0].clientY - touchY) * 0.005;
      group.rotation.y += dx;
      group.rotation.x += dy;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      e.preventDefault();
    }
  }, { passive: false });

  // ---------- Animate ----------
  function animate() {
    requestAnimationFrame(animate);
    if (!isDragging) {
      group.rotation.y += velX;
      group.rotation.x += velY;
    }
    renderer.render(scene, camera);
  }
  animate();

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Re-fit camera distance for the new aspect ratio
    BASE_Z = fitDistance();
    camera.position.z = BASE_Z / zoom;
  });

  // Initial tilt
  group.rotation.x = -0.35;
  group.rotation.y = 0.4;
}
</script>
</body>
</html>
