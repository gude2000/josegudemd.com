<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webb fractal — interactive</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0a0e1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: #b9b09b;
  }
  #scene { width: 100vw; height: 100vh; cursor: grab; }
  #scene:active { cursor: grabbing; }
  .caption {
    position: absolute; bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(218, 160, 85, 0.7);
    pointer-events: none;
    user-select: none;
  }
  .hint {
    position: absolute; top: 14px; right: 14px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(185, 176, 155, 0.45);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="scene"></div>
<div class="hint">drag · scroll</div>
<div class="caption">The Webb fractal &nbsp;·&nbsp; 34.38° &nbsp;·&nbsp; 55.62° &nbsp;·&nbsp; 90.00°</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- Three.js scene setup ----------
  const container = document.getElementById('scene');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e1a);

  const camera = new THREE.PerspectiveCamera(
    45, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  camera.position.set(0, 0, 7);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // ---------- Geometry: the Webb fractal ----------
  // Base right triangle with angles 34.38° (A), 55.62° (B), 90° (C).
  // φ = 1.618033988...; the legs satisfy the golden ratio.
  const PHI = (1 + Math.sqrt(5)) / 2;

  // Build the seed triangle in the XY plane.
  // Right angle at C = (0,0,0). A along +X, B along +Y.
  // Tan(34.38°) ≈ 0.6826; we set BC = 1 (opposite A), AC = BC / tan(34.38°)
  const A = new THREE.Vector3( PHI, 0, 0 );
  const B = new THREE.Vector3( 0, 1,    0 );
  const C = new THREE.Vector3( 0, 0,    0 );

  // We build a tetrahedral structure by reflecting the seed triangle across
  // each of its edges into 3D. The result is a 3-D piece-wise lattice that
  // captures the spirit of the cover's 3-D fractal triangle.
  const seedPoints = [A.clone(), B.clone(), C.clone()];

  // Make a fourth apex above the centroid to lift into 3D
  const centroid = new THREE.Vector3()
    .add(A).add(B).add(C).multiplyScalar(1/3);
  const apex = centroid.clone().add(new THREE.Vector3(0, 0, 0.95));

  // Build the full vertex set (base triangle + apex)
  const verts = [
    A.clone(), B.clone(), C.clone(),
    apex.clone(),
  ];

  // Edges of the outer tetrahedron
  const baseEdges = [
    [0,1],[1,2],[2,0],   // base triangle
    [0,3],[1,3],[2,3],   // sides to apex
  ];

  // Recursive subdivision: each edge gets a midpoint sphere, and each
  // mid-triangle becomes a smaller wireframe (one level of recursion).
  function midpoint(p, q) {
    return new THREE.Vector3()
      .add(p).add(q).multiplyScalar(0.5);
  }

  const mids = [];
  baseEdges.forEach(([i,j]) => mids.push(midpoint(verts[i], verts[j])));

  // Sub-triangles: each face of the tetrahedron yields 4 sub-triangles when
  // we connect midpoints, but we just visualize the midpoint frame.
  // We'll create edges between mids that share a face.
  const faces = [
    [0,1,2],   // base
    [0,1,3],   // side 1
    [1,2,3],   // side 2
    [0,2,3],   // side 3
  ];

  // For each face, find the indices into mids[] for its three edges
  function edgeIdx(i, j) {
    return baseEdges.findIndex(([a,b]) => (a===i&&b===j) || (a===j&&b===i));
  }

  const subEdges = [];
  faces.forEach(([i,j,k]) => {
    const e_ij = edgeIdx(i,j);
    const e_jk = edgeIdx(j,k);
    const e_ki = edgeIdx(k,i);
    subEdges.push([e_ij, e_jk]);
    subEdges.push([e_jk, e_ki]);
    subEdges.push([e_ki, e_ij]);
  });

  // ---------- Build the meshes ----------
  const group = new THREE.Group();
  scene.add(group);

  // Outer wireframe (golden, slim)
  const goldMat = new THREE.LineBasicMaterial({
    color: 0xc48c42, transparent: true, opacity: 0.85,
  });
  const baseGeom = new THREE.BufferGeometry();
  const basePositions = [];
  baseEdges.forEach(([i,j]) => {
    basePositions.push(verts[i].x, verts[i].y, verts[i].z);
    basePositions.push(verts[j].x, verts[j].y, verts[j].z);
  });
  baseGeom.setAttribute('position', new THREE.Float32BufferAttribute(basePositions, 3));
  group.add(new THREE.LineSegments(baseGeom, goldMat));

  // Inner wireframe (cream, fainter)
  const creamMat = new THREE.LineBasicMaterial({
    color: 0xe8e0ce, transparent: true, opacity: 0.40,
  });
  const subGeom = new THREE.BufferGeometry();
  const subPositions = [];
  subEdges.forEach(([i,j]) => {
    subPositions.push(mids[i].x, mids[i].y, mids[i].z);
    subPositions.push(mids[j].x, mids[j].y, mids[j].z);
  });
  subGeom.setAttribute('position', new THREE.Float32BufferAttribute(subPositions, 3));
  group.add(new THREE.LineSegments(subGeom, creamMat));

  // Outer vertices: large pale spheres
  const sphereGeom = new THREE.SphereGeometry(0.075, 24, 16);
  const palette = {
    outer: 0xe8e0ce,
    apex:  0xdaa055,
    midA:  0xc48c42,    // gold
    midB:  0x78c8b4,    // teal
    midC:  0xb4a0e6,    // violet
  };

  verts.forEach((v, idx) => {
    const mat = new THREE.MeshBasicMaterial({
      color: idx === 3 ? palette.apex : palette.outer
    });
    const s = new THREE.Mesh(sphereGeom, mat);
    s.position.copy(v);
    s.scale.setScalar(idx === 3 ? 0.9 : 1.0);
    group.add(s);
  });

  // Midpoint vertices: small accent spheres (rotating gold / teal / violet)
  const midSphereGeom = new THREE.SphereGeometry(0.045, 18, 12);
  mids.forEach((m, idx) => {
    const color = [palette.midA, palette.midB, palette.midC][idx % 3];
    const mat = new THREE.MeshBasicMaterial({ color });
    const s = new THREE.Mesh(midSphereGeom, mat);
    s.position.copy(m);
    group.add(s);
  });

  // Center the geometry on the origin of the group
  const bbox = new THREE.Box3().setFromObject(group);
  const center = new THREE.Vector3();
  bbox.getCenter(center);
  group.children.forEach(child => child.position.sub(center));
  // Re-translate the vertices in baseGeom and subGeom buffers
  const recenter = (geom) => {
    const arr = geom.attributes.position.array;
    for (let i = 0; i < arr.length; i += 3) {
      arr[i]   -= center.x;
      arr[i+1] -= center.y;
      arr[i+2] -= center.z;
    }
    geom.attributes.position.needsUpdate = true;
  };
  recenter(baseGeom);
  recenter(subGeom);

  // Soft ambient glow via a couple of tinted points-of-light implied by colors
  // (using basic materials, no actual lighting setup needed)

  // ---------- Interaction ----------
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let velX = 0.002, velY = 0.0006;  // gentle auto-spin
  let zoom = 1;
  const minZoom = 0.5, maxZoom = 2.5;

  container.addEventListener('mousedown', e => {
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
    velX = 0; velY = 0;
  });
  window.addEventListener('mouseup',   () => { isDragging = false; });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = (e.clientX - lastX) * 0.005;
    const dy = (e.clientY - lastY) * 0.005;
    group.rotation.y += dx;
    group.rotation.x += dy;
    lastX = e.clientX; lastY = e.clientY;
  });
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.05 : 0.95;
    zoom = Math.max(minZoom, Math.min(maxZoom, zoom * factor));
    camera.position.z = 7 / zoom;
  }, { passive: false });

  // Touch
  let touchX = 0, touchY = 0;
  container.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      velX = 0; velY = 0;
    }
  });
  container.addEventListener('touchmove', e => {
    if (e.touches.length === 1) {
      const dx = (e.touches[0].clientX - touchX) * 0.005;
      const dy = (e.touches[0].clientY - touchY) * 0.005;
      group.rotation.y += dx;
      group.rotation.x += dy;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      e.preventDefault();
    }
  }, { passive: false });

  // ---------- Animate ----------
  function animate() {
    requestAnimationFrame(animate);
    if (!isDragging) {
      group.rotation.y += velX;
      group.rotation.x += velY;
    }
    renderer.render(scene, camera);
  }
  animate();

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Initial tilt
  group.rotation.x = -0.35;
  group.rotation.y = 0.4;
})();
</script>
</body>
</html>
